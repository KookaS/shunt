site_name: Shunt
site_description: >-
  Pre-alpha, cache-safe LLM proxy that today forwards to a cheap default; kNN
  outcome-based routing is designed and offline-validated but not yet live.
site_url: https://kookas.github.io/shunt/
repo_url: https://github.com/KookaS/shunt
repo_name: KookaS/shunt
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Feedback: feedback.md
  - The routing model: routing.md
  - Error detection & auto-escalation: escalation.md
  - The escalation claim: escalation-claim.md
  - Escalation dataset: escalation-data-card.md
  - Reproducing the escalation eval: escalation-reproduction.md
  - Results: results.md
  - Research log: research-log.md
  - Benchmark: benchmark.md
  - Benchmark dataset: benchmark-data.md
  - Benchmark design: benchmark-design.md
  - Live smoke: live-smoke-runbook.md
  - Free-tier smoke: free-tier-smoke.md

markdown_extensions:
  - admonition
  # `{#fig-<slug>}` on a figure heading: the stable deep-link target the README and
  # docs/results.md point at, and the key SH009 parses to hold each figure's section in
  # bijection with benchmark/<half>/figures.json.
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
