# Shunt Benchmark Configuration
# Human-editable. Changes here propagate to all scripts.
# All model metadata (tier, pricing, provider) lives in the model registry
# (src/shunt/config/models.yaml).
# This file only controls which models are active and how routing behaves.

models:                 # enabled models; a name must exist in the registry.
                        # Omit a registry model here to disable it (opus is off).
  - deepseek-v4-flash
  - qwen3.7-plus
  - gpt-5-mini
  - kimi-k2.5
  - zai-glm-5.2
  - kimi-k3

strategies:
  enabled:
    - oracle              # upper bound (perfect knowledge, best quality)
    - always_frontier     # baseline: always the most expensive model
    - always_cheap        # baseline: always the cheapest model
    - knn_semantic        # CONTROL: the semantic-embedding selection rule with the ladder removed
    - knn_semantic_cascade  # the semantic-kNN pick, then the ladder at session cadence (opt-in routing)
    - knn_semantic_cascade_withintask  # blocked: semantic-kNN try-verify-escalate INSIDE one task
    - knn_difficulty   # CONTROL: judge-difficulty selection rule with the ladder removed
    - knn_difficulty_cascade  # judge-difficulty pick, then the ladder at session cadence
    - difficulty_band_cascade # "just judge label + escalation": same-difficulty-band pick, then the ladder
    - price_cascade       # zero-ML floor: cheapest-first try-verify-escalate, no embeddings
    - session_cascade     # THE SHIPPED DEFAULT: the escalation ladder at session cadence (cache-safe)
    - knn_semantic_tier   # single-shot: predict crossover tier from semantic neighbours, route there
    # - oracle_reward      # same as oracle with different cost weight
    # - random             # not useful for comparison
  knn_semantic:
    k: 20
    success_rate_threshold: 0.6   # lower = more cost savings, higher = more reliability
    min_samples: 3
  # The difficulty family has its OWN knobs: the semantic kNN's thresholds describe an embedding
  # neighbourhood, and borrowing them would couple the two families' tuning. Its judge cost is
  # not a knob — it is the MEASURED per-task cost from judge_difficulty.json.
  knn_difficulty:
    k: 20
    success_rate_threshold: 0.6
    min_samples: 3
  difficulty_band:
    success_rate_threshold: 0.6
    min_samples: 3
  # NOTE: `knn_semantic_cascade` (opt-in routing) has NO block of its own. It takes the
  # `knn_semantic` selection knobs above and the `session_cascade` ladder knobs below verbatim,
  # so the two session-cadence rows can never be scored at two different ladders. The block
  # below configures the BLOCKED within-task row only.
  knn_semantic_cascade_withintask:
    max_tries: 3
    success_rate_threshold: 0.6
  knn_semantic_tier:
    success_rate_threshold: 0.6   # neighbour pass-rate at a tier's rung to route there
  session_cascade:
    # The PRODUCT's escalation defaults (src/shunt/router/escalation.py EscalationConfig), so
    # the offline row scores the policy production actually runs. Changing one here without
    # changing it there measures a policy nobody ships.
    escalate_after_n: 2
    stale_window: 10
    # PINNED to rank_only, and the product's default is effort_then_rank — a deliberate,
    # documented divergence, not an oversight. The effort rung serves a NON-DEFAULT reasoning
    # arm, and results.csv holds a 3-arm measurement for only 54 of 770 (task, model) cells, so
    # scoring effort_then_rank censors 71 of 200 tasks as coverage gaps AND leaves a survivor set
    # that is 100% pass at $1.31 — a selection artefact that would be drawn as a Pareto-dominant
    # point. rank_only is a shipped ladder value (escalation.ESCALATION_LADDERS), scores 0
    # unscorable on the completed matrix, and is the largest honestly-measurable slice of the live
    # ladder. Flip this back when per-arm coverage exists; do not flip it to make a nicer number.
    ladder: rank_only
    # `rank_shortlist` is deliberately ABSENT: omitting it makes the replay inherit whatever
    # `EscalationConfig` ships, so the offline row always prices the ladder production runs. Set it
    # only to SWEEP the knob (0 restores the pre-shortlist every-rank walk); a value pinned here
    # that disagrees with router.yaml measures a ladder nobody runs.

routing:
  control_model: kimi-k3    # strongest ENABLED frontier = kill-gate baseline (opus-4-6 priced but disabled)
  gamma: 0.1

# Derived per-model capability rank (see docs/benchmark-design.md). The monotone-ladder
# order is DERIVED from measured co-measured pairwise dominance (Copeland), not from
# hardcoded tiers — a model that measures weaker than a cheaper one ranks below it from
# the data, with no manual re-tier hack. A model failing the confidence gate below falls
# back to its price-implied slot (price ascending). Knobs are pinned (constants_pinned
# discipline); re-pin only on a material suite-scale change, noting the reason here.
capability_rank:
  K: 20            # min real cells for a model's measured rank (guards tiny-n lucky intervals)
  W: 0.35          # max Wilson CI width for a measured rank (the real confidence gate)
  min_pairs: 8     # min co-measured disagreement tasks for a pair to inform the Copeland score
  baseline: null   # optional last-reviewed order; when set, a rank flip requires disjoint CIs

# Monotone-ladder imputation: complete the asymmetric outcome matrix in memory so
# every strategy is scored on one equal-coverage task set. NEVER persisted to
# results.csv (recomputed each run). The scoring path reads these flags.
impute:
  enabled: true             # gate the completion (false reproduces raw-coverage behaviour)
  drop_unsolvable: false    # keep universal-fail tasks in the denominator (equal N across strategies)

# p(arm|model) exploration sampling. A model's default_arm always
# runs; each other bracket arm of rank `r` (0 = cheapest) runs on the fraction of
# challenges below weights[r] (deterministic, cost-skewed toward cheaper arms).
# Each weight is an INDEPENDENT per-arm inclusion probability in [0, 1] (a Bernoulli
# threshold), NOT a categorical distribution — they need not sum to 1. Lower weights
# on higher-rank (pricier) arms = fewer expensive runs = cheaper exploration.
# Ranks beyond the list reuse the last weight. Keeps exploration within ~1.5-1.9x
# of today's cost instead of running the full bracket on every cell — the flatter
# tail (rank-2 at 0.25, not 0.1) is deliberate: the higher-effort arms ARE the arms
# the escalation effort-rung escalates into, so starving them at 0.1 left that rung
# unevaluable. 0.25 lifts them from ~unusable to bare-minimum coverage.
# `enabled` gates the sweep: the live executor now overlays each arm's registry API
# params onto the request (infer._scaffold_model_kwargs), so distinct arms bill
# distinct requests — the wiring this gate previously waited on. Set false to
# reproduce default-arm-only runs.
arm_sampling:
  enabled: true
  weights: [0.6, 0.4, 0.25]   # cheaper-skewed; each is an independent p, not a distribution
  # Models pinned to their DEFAULT arm even while the sweep is on — the expensive
  # tiers (high/frontier), where extra reasoning arms aren't worth the per-cell cost.
  # Their default arm is already the high-reasoning one; other models still explore.
  default_only_models: [zai-glm-5.2, kimi-k3]

# Per-model REPLICATE depth: how many independent observations of each of a model's cells to
# collect. Rep 0 is the canonical observation the scoring path reads; reps 1..R-1 are audit
# data (see `config.reduce_reps`), so raising R never moves a published number — it only
# measures the run-to-run variance behind one.
#
# `enabled: false` IS A SPEND SAFETY, not a stylistic default. R>1 multiplies live collection
# cost linearly, and the owner's total new-measurement budget is under $5, so depth is opt-in
# per run. Consumed at exactly two sites — `run_matrix.classify_cells` (which emits the extra
# cells) and the column-coverage report. The SCORING path must never read it.
replicates:
  enabled: false
  default_r: 1
  by_model:
    deepseek-v4-flash: 3
    kimi-k3: 1

# Adaptive frontier collection (see docs/benchmark.md).
# This is the DEFAULT runner strategy: `python -m benchmark.runner.run_matrix`
# (--strategy cost_optimal) runs the two-phase protocol — observe cheap+mid on all
# sampled tasks, derive the discriminating set, then run the frontier (control_model)
# on discriminating + a uniform random audit stratum. `--strategy full` runs the
# exhaustive matrix instead. The knobs below tune the cost_optimal strategy.
#
# audit_fraction + noninferiority_margin were PINNED 2026-07-19 from results.csv
# (measured cheap<->frontier ρ²≈0.04, discriminating count) via the CI-sizing rule in
# docs/benchmark.md; constants_pinned: true. Re-pin if the suite scale changes materially
# (audit_fraction must still yield >=~10 absolute audit tasks at your run scale).
collect:
  enabled: false            # gates run_eval's partial-coverage frontier-gate estimation.
                            #   The cost_optimal strategy itself always runs when invoked
                            #   (run_matrix --strategy cost_optimal); this flag does NOT gate it.
  constants_pinned: true    # SAFETY: a --live run refuses while false. Pinned 2026-07-19 from
                            #   results.csv (see below); re-check audit_fraction yields >=~10
                            #   absolute audit tasks at your run scale before a large paid run.
  phase_a_mode: single      # single = one representative model per tier | full = every cheap+mid model
  audit_fraction: 0.12      # π for the uniform audit. Sized to draw ~15-18 audit tasks at the
                            #   200-challenge scale. NOTE: measured corr(cheap+mid,frontier)=0.21
                            #   (ρ²=0.04) — the AIPW covariate barely helps, so the gate rests on
                            #   the paired McNemar + audit, and savings vs `full` are modest at small N.
  audit_salt: frontier-audit-v1
  include_high: false       # add the 'high' tier to the frontier phase (extra oracle point)
  noninferiority_margin: 0.05   # δ: the pre-registered 5pp equal-quality bar for paired McNemar
  budget_phase_a: null      # per-phase --max-cost override (null = shared ceiling)
  budget_phase_c: null

# Ladder collector (benchmark.runner.ladder_collect). Escalates up to --workers challenges
# concurrently, each serial cheap->strong. The budget "reservation" that keeps concurrent
# challenges from jointly overspending --max-cost is a CONSERVATIVE UPPER BOUND (the max
# observed real_cost per model, not the median). A tier with no measured cost yet reserves
# `cold_start_tier_cost` instead of 0 — otherwise a fresh run (empty results.csv) would
# reserve 0 per tier and admit --workers challenges that each run uncapped.
ladder:
  cold_start_tier_cost: 1.0   # USD reserved per UNMEASURED tier. Conservative: above the
                              # measured p90 per-cell real_cost (~$0.27) and below the
                              # observed max (~$2.95), so a cold-start run won't admit an
                              # unbounded first wave yet still admits challenges under a
                              # realistic cap. Superseded per-model once a real cost is measured.

# Live agent-scaffold bounds (benchmark.runner.infer). step_limit is the PRIMARY, model-speed-
# agnostic per-cell bound: every model gets the SAME number of agent steps regardless of inference
# speed (wall-clock timing unfairly penalises slow models). The wall-clock ceiling is a generous
# GRACEFUL secondary backstop set from --timeout (default 1800s), and an external watchdog fires
# strictly LATER (+300s) as a hard last resort for a genuine single-call hang — so a normal slow
# run always terminates gracefully with its real usage.cost captured, never abandoned at $0.
# step_limit 150 is justified from the measured HAZARD, not passers' percentiles (the old p90=58 /
# p95=68 rationale was survivorship-biased — conditioning on cells that passed says nothing about
# cells still alive at step 70). Of the 92 corpus cells still running at step 70 under the old
# 250-step budget, 37 (40.2%) went on to pass; 35 of those 37 (95%) finished by step 150, so 150 is
# where censoring drops from a ~40% loss to a ~2% tail. Raised together with cost_limit so the
# budget increase cannot relabel cost censors as step censors.
live:
  step_limit: 150
  # Per-cell USD cost ceiling passed to the agent scaffold. 4.0 MOVES WITH step_limit (the two are
  # raised together: a 150-step kimi-k3 cell projects to ~$2.6, so the step cap binds before the
  # cost cap and a legitimately step-limited run is never mislabelled a cost censor). A declared
  # key means the cap a run obeys is recorded where the run is configured. The scaffold raises
  # LimitsExceeded for BOTH limits and the censoring layer maps it to stop_reason=step_limit, so
  # raising the step cap alone converts step censors into cost censors under a label that lies.
  cost_limit: 4.0
  # LOCAL-endpoint serving contract (benchmark/runner/serving_guard.py). Only read when a model's
  # base_url resolves to this host; hosted providers ignore it. The largest prompt one cell may
  # present to the server: the pre-flight refuses unless the server serves
  # n_ctx >= prompt_budget + max_tokens, so a turn can never be asked to generate past the end of
  # its own window. Declared rather than defaulted because the number IS the safety margin — an
  # undeclared one silently became 16384-6000 on the run that motivated this key, putting the
  # hazard boundary at a 10384-token prompt the scaffold crossed by turn ~10 of every cell.
  serving:
    prompt_budget: 26000
    # Fallback generation cap for the same arithmetic, used ONLY when neither the model
    # registry's reasoning arm nor the mini-swe-agent overlay sends an explicit `max_tokens`
    # (which is the case today for every registered model). Without it the guard could never be
    # satisfied by any local endpoint. 6000 is the cap the motivating run actually used.
    max_tokens: 6000

paths:
  challenges: routing/data/challenges.json        # curated input, relative to config.py dir
  results_csv: routing/results.csv                # generated source of truth (read-write)
  challenge_store: challenges                     # relative to benchmark/

benchmark:
  seed: 42
  bootstrap_iterations: 10000
  n_default: 20
  sample_size: 200            # 0 = all tasks, N = first N tasks in the nested order (cost-safe partial run)
