# Provider auth signatures — validation metadata for tools/provider_probe.py.
# Both directions: how a bogus key is REJECTED (keyless), and the free endpoint a
# real key is ACCEPTED on (positive_endpoint, --authenticated).
#
# One block per MEASURED provider (live, keyless; each block carries its own
# measured_as_of). Keyed by provider
# name; connection facts (base_url) are NOT here — they live once in
# examples/providers/<name>.yaml, the single owner. The probe merges a provider's
# connection row (from the examples catalog) with its signature (from this file)
# by name. `local` is absent on purpose: a local server needs no key, so there is
# no auth rejection to measure.
#
# Fields per block: endpoint (default /v1/chat/completions), expect_status,
# expect_body_pattern, probe_model, measured_as_of — all for the KEYLESS rejection
# check. `probe_model` names a real model id for a provider that validates the model
# before auth (NIM, SambaNova), so its rejection is auth-shaped rather than a 404
# indistinguishable from a wrong base_url; absent keeps the deliberately-bogus id.
# Plus positive_endpoint for the AUTHENTICATED acceptance check (--authenticated,
# secrets-gated): the GET-only, ALWAYS-FREE endpoint a real key must answer 200 on.
# Default /v1/models; overridden where that is public (OpenRouter -> /v1/auth/key);
# `null` where the provider has no free authenticated endpoint (Requesty), so its
# positive check is skipped rather than billed. The authenticated check NEVER runs
# a completion — it must not cost anything.
# Triage on a live failure: re-measure, update the block + its measured_as_of.

requesty:
  # Measured live, keyless: requesty rejects a bogus token with 403, not 401.
  expect_status: [403]
  expect_body_pattern: Invalid authorization token
  measured_as_of: "2026-07-17"
  # Requesty's /v1/models is a public 200 catalog and it exposes no free auth
  # endpoint (measured: /v1/credits, /v1/user, … all 404), so the only positive
  # check would be a billed completion. null -> skip it; stay strictly free.
  positive_endpoint: null
deepseek:
  # Default positive_endpoint /v1/models: DeepSeek authenticates GET /v1/models,
  # so a real key returns 200 for free (no completion billed).
  expect_status: [401]
  measured_as_of: "2026-07-17"
openai:
  expect_status: [401]
  measured_as_of: "2026-07-17"
groq:
  expect_status: [401]
  measured_as_of: "2026-07-17"
mistral:
  expect_status: [401]
  measured_as_of: "2026-07-17"
together:
  expect_status: [401]
  measured_as_of: "2026-07-17"
cerebras:
  expect_status: [401]
  measured_as_of: "2026-07-17"
nebius:
  expect_status: [401]
  measured_as_of: "2026-07-17"
openrouter:
  # Keyless: default endpoint deliberately. OpenRouter serves /v1/models as a
  # PUBLIC catalog (measured: 200, no auth) — probing there passes green on a
  # completely broken key, the exact failure the probe exists to catch.
  expect_status: [401]
  measured_as_of: "2026-07-17"
  # Positive: /v1/models is public, so it cannot prove the key. /v1/auth/key
  # requires auth and returns key/credit info at zero cost (measured: 401 keyless).
  positive_endpoint: /v1/auth/key
xai:
  # Measured: xAI validates the model id BEFORE auth on chat/completions, so a
  # bogus key returns `Model not found` — even with a real model id. On
  # /v1/models it returns 400 carrying an auth message. Non-auth status code,
  # auth-shaped body: only the body pattern distinguishes it.
  endpoint: /v1/models
  expect_status: [400]
  expect_body_pattern: Incorrect API key provided
  measured_as_of: "2026-07-17"
fireworks:
  # Measured: with a bad key every Fireworks model reads as "inaccessible", so
  # chat/completions answers 404 — the SAME status as a wrong base_url, which
  # is what the probe is for. Holds with a real model id and with no auth
  # header at all. /v1/models is the only clean auth signal Fireworks offers.
  endpoint: /v1/models
  expect_status: [401]
  measured_as_of: "2026-07-17"
explabs:
  # Measured live, keyless (2026-09-06): the Experiential gateway rejects a missing
  # key with 401 {"error":{"code":"invalid_key",...}} on both /v1/models and
  # /v1/chat/completions. Keyed /v1/models returns 200 for free (the positive check).
  expect_status: [401]
  expect_body_pattern: invalid_key
  measured_as_of: "2026-09-06"
  positive_endpoint: /v1/models
# Free-tier harvest providers (plan step 6). Each is an OpenAI-compatible bearer-token
# surface; the blocks below are filled from the live keyless rejection, not assumed.
google_ai_studio:
  # Measured live, keyless (2026-09-10): the OpenAI-compatible surface answers a bogus
  # key with 400 "Please pass a valid API key" (not 401). Its base_url lives under /openai/,
  # NOT /v1, so the host-absolute endpoint carries no version segment.
  endpoint: /chat/completions
  expect_status: [400]
  expect_body_pattern: valid API key
  measured_as_of: "2026-09-10"
  positive_endpoint: /models
nvidia_nim:
  # Measured live, keyless (2026-09-10): with a REAL model id and a bogus key, NIM answers
  # 401 {"status":401,...,"Authentication failed"}. `/v1/models` is a public 200 catalog, so
  # it cannot be the auth signal; a nonexistent model 404s before auth, hence probe_model.
  expect_status: [401]
  probe_model: moonshotai/kimi-k3
  measured_as_of: "2026-09-10"
vercel_ai_gateway:
  # Measured live, keyless (2026-09-10): 401 on /v1/chat/completions.
  expect_status: [401]
  measured_as_of: "2026-09-10"
sambanova:
  # Measured live, keyless (2026-09-10): with a REAL model id and a bogus key, SambaNova
  # answers 401 {"code":"invalid_api_key"}. `/v1/models` is public, and a nonexistent model
  # 404s model_not_found before auth, hence probe_model.
  expect_status: [401]
  expect_body_pattern: invalid_api_key
  probe_model: Meta-Llama-3.3-70B-Instruct
  measured_as_of: "2026-09-10"
opencode_zen:
  # Measured live, keyless (2026-09-10): 401 on /v1/chat/completions.
  expect_status: [401]
  measured_as_of: "2026-09-10"
# NOT here, with the measured reason:
#   cloudflare_workers_ai — its base_url embeds ${CLOUDFLARE_ACCOUNT_ID}; without the account
#     id the keyless probe cannot address the endpoint, and a signature would be invented.
#     Re-measure and add it once the account id is available.
#   kilo_gateway — host verified as https://api.kilo.ai/api/gateway (Kilo docs,
#     https://kilocode.ai/docs/gateway/); the keyless auth-rejection signature is not yet
#     measured, so it stays out. Re-measure and add it here once opted into the probe.
