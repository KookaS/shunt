<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
     viewBox="0 0 1200 630" role="img" aria-label="When the cheap model stalls, Shunt reroutes.">

  <defs>
    <!-- userSpaceOnUse is REQUIRED, not stylistic: filter regions default to
         objectBoundingBox, and a perfectly horizontal path has a zero-height
         bbox — so a glow filter silently erases flat road segments entirely. -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#06070a"/>
  <g stroke="#161923" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="60" y1="0" x2="60" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

    <text x="72" y="96" font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace" font-size="13" letter-spacing="3.2"
          fill="#8f7cff">SHUNT · THE ROUTING DECISION</text>
    <text x="72" y="142" font-family="'DejaVu Sans','Inter',Arial,sans-serif" font-size="35" font-weight="700"
          fill="#eceef4">When the cheap model stalls, Shunt reroutes.</text>
    <text x="72" y="174" font-family="'DejaVu Sans','Inter',Arial,sans-serif" font-size="17" fill="#9195a3">Escalation happens at a task boundary — never mid-request.</text>
    <text x="72" y="198" font-family="'DejaVu Sans','Inter',Arial,sans-serif" font-size="17" fill="#9195a3">Once the route escalates, it stays on the stronger model.</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400,500 L520,380 L680,380 L800,500" stroke="#5BC8FA" stroke-width="16" filter="url(#glow)"/>
    <path d="M800,500 L970,500 L1080,390" stroke="#5BC8FA" stroke-width="16" filter="url(#glow)"/>
    <path d="M120,500 L400,500" stroke="#4D6BFE"
          stroke-width="18" filter="url(#glow)"/>
    <path d="M400,500 L800,500" stroke="#E5484D"
          stroke-width="18" opacity="0.3"/>
    <path d="M400,500 L800,500" stroke="#E5484D"
          stroke-width="18" stroke-dasharray="18 14" stroke-linecap="butt"/>
  </g>
  <g><rect x="198" y="488" width="4" height="24" rx="2" fill="#9195a3"/><rect x="288" y="488" width="4" height="24" rx="2" fill="#9195a3"/><rect x="558" y="368" width="4" height="24" rx="2" fill="#9195a3"/><rect x="618" y="368" width="4" height="24" rx="2" fill="#9195a3"/></g>

  <circle cx="400" cy="500" r="15" fill="#06070a" opacity="0.92"/><circle cx="400" cy="500" r="11" fill="#4D6BFE"/><circle cx="400" cy="500" r="6" fill="#06070a"/>
  <circle cx="800" cy="500" r="15" fill="#06070a" opacity="0.92"/><circle cx="800" cy="500" r="11" fill="#5BC8FA"/><circle cx="800" cy="500" r="6" fill="#06070a"/>

    <g>
      <circle cx="120" cy="500" r="18" fill="#4D6BFE" opacity="0.22"/>
      <circle cx="120" cy="500" r="10.5" fill="#4D6BFE"/>
      <circle cx="120" cy="500" r="4.5" fill="#ffffff"/>
    </g>

    <g>
      <rect x="1078.5" y="344" width="3" height="48" rx="1.5" fill="#eceef4"/>
      <rect x="1083" y="348" width="28" height="21" fill="#0d1018"
            opacity="0.9"/><rect x="1083" y="348" width="7" height="7" fill="#ffffff"/><rect x="1090" y="348" width="7" height="7" fill="#12141c"/><rect x="1097" y="348" width="7" height="7" fill="#ffffff"/><rect x="1104" y="348" width="7" height="7" fill="#12141c"/><rect x="1083" y="355" width="7" height="7" fill="#12141c"/><rect x="1090" y="355" width="7" height="7" fill="#ffffff"/><rect x="1097" y="355" width="7" height="7" fill="#12141c"/><rect x="1104" y="355" width="7" height="7" fill="#ffffff"/><rect x="1083" y="362" width="7" height="7" fill="#ffffff"/><rect x="1090" y="362" width="7" height="7" fill="#12141c"/><rect x="1097" y="362" width="7" height="7" fill="#ffffff"/><rect x="1104" y="362" width="7" height="7" fill="#12141c"/>
      <circle cx="1080" cy="390" r="5.5" fill="#eceef4"/>
    </g>


    <g>
      <rect x="199.7" y="540.0" width="124.6" height="32"
            rx="16.0" fill="#0e1428" stroke="#2c3a6b" stroke-width="1.5"/>
      <text x="262" y="561.8" text-anchor="middle" font-family="'DejaVu Sans','Inter',Arial,sans-serif"
            font-size="16" fill="#cfd8ff" letter-spacing="0.2">DeepSeek v4</text>
    </g>

    <g>
      <rect x="555.6" y="314.0" width="88.7" height="32"
            rx="16.0" fill="#06202c" stroke="#1d5a78" stroke-width="1.5"/>
      <text x="600" y="335.8" text-anchor="middle" font-family="'DejaVu Sans','Inter',Arial,sans-serif"
            font-size="16" fill="#cdefff" letter-spacing="0.2">Fable 5</text>
    </g>

    <g>
      <rect x="860.6" y="540.0" width="88.7" height="32"
            rx="16.0" fill="#06202c" stroke="#1d5a78" stroke-width="1.5"/>
      <text x="905" y="561.8" text-anchor="middle" font-family="'DejaVu Sans','Inter',Arial,sans-serif"
            font-size="16" fill="#cdefff" letter-spacing="0.2">Fable 5</text>
    </g>

    <g>
      <rect x="440.0" y="541.0" width="320.0" height="30"
            rx="15.0" fill="#26090c" stroke="#6e2a2e" stroke-width="1.5"/>
      <text x="600" y="561.0" text-anchor="middle" font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace"
            font-size="14" fill="#ffd2d4" letter-spacing="0.2">tests still failing · retries spent</text>
    </g>

  <text x="114" y="546" font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace" font-size="13"
        fill="#5c6070">task start</text>
  <text x="1106" y="326" text-anchor="middle" font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace"
        font-size="13" fill="#5c6070">verified · done</text>
  <text x="370" y="478" text-anchor="end" font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace"
        font-size="12" fill="#5c6070">task boundary</text>
</svg>
