    <text x="72" y="96" font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace" font-size="13" letter-spacing="3.2"
          fill="#8f7cff">SHUNT · THE ROUTING DECISION</text>
    <text x="72" y="142" font-family="'DejaVu Sans','Inter',Arial,sans-serif" font-size="35" font-weight="700"
          fill="#eceef4">When the cheap model stalls, Shunt reroutes.</text>
    <text x="72" y="174" font-family="'DejaVu Sans','Inter',Arial,sans-serif" font-size="17" fill="#9195a3">Escalation happens at a task boundary — never mid-request.</text>
    <text x="72" y="198" font-family="'DejaVu Sans','Inter',Arial,sans-serif" font-size="17" fill="#9195a3">Once the route escalates, it stays on the stronger model.</text>

  <!-- casings: every route stroke sits in a dark trench so it reads as a road -->
