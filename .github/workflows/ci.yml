name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A superseded PR run is wasted runner time, and a stacked queue hides which run is
# authoritative. `main` pushes are never cancelled — those runs gate the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Secret scan (LFS corpus)
        # The pre-commit gitleaks hook only sees the staged diff's Git-LFS POINTERS, so a real
        # secret inside a committed benchmark trajectory would sail through it. Scan the actual
        # LFS content instead. Scoped to benchmark/escalation/data/ with the config passed
        # explicitly: `gitleaks dir` only auto-discovers <target>/.gitleaks.toml, and it
        # IGNORES .gitignore, so pointing it at the repo root would also read the dev's
        # root-level .env.
        run: |
          gitleaks dir --no-banner --config .gitleaks.toml benchmark/escalation/data/
      - name: Secret scan (full checked-out tree)
        # The pre-commit gitleaks hook is `--staged`, which is VACUOUS in CI: on a clean
        # checkout nothing is staged, so 0 bytes get scanned. The LFS step above only covers
        # benchmark/escalation/data/. This step scans the WHOLE working tree (tracked content,
        # LFS content included) with the allowlist config passed explicitly. `detect` rather
        # than `dir` because detect respects .gitignore: the repo's root-level `.env` and
        # caches are gitignored, so they are never read even if this is ever run on a dev
        # machine where one exists.
        run: |
          gitleaks detect --no-banner --config .gitleaks.toml --redact .
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev --extra benchmark
      # Single source of truth: the same .pre-commit-config.yaml devs run locally
      # (ruff, ruff-format, mypy strict, the custom SH001/SH002/SH004/SH005
      # blocking checks + SH003 advisory, benchmark config validation, whitespace,
      # gitleaks). Running the config here is what guarantees pre-commit ↔ CI
      # parity — CI enforces the exact custom checks, not a drifted subset.
      - name: pre-commit (lint, format, types, custom SH0xx checks, config validation)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Docs integrity
        run: |
          for d in research internals notes wip drafts experiments; do
            if [ -d "docs/$d" ]; then
              echo "BANNED: docs/$d/ exists — internal artifacts don't belong here"
              exit 2
            fi
          done
          echo "docs/ structure OK"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/escalation reads the committed trajectory corpus, which is Git-LFS-tracked;
          # without lfs:true the reads hit 130-byte pointers and the escalation tests fail.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install uv
          # `--extra capture` installs cryptography, which the encryption-at-rest tests
          # (tests/capture/test_trajectory_capture.py) need to RUN rather than skip —
          # see the `capture` extra's comment in pyproject.toml.
          uv sync --extra dev --extra benchmark --extra capture
      - name: Embedding pipeline (faithful fake — no ONNX download)
        # Proves the real embedding SETUP (embed -> store -> HNSW index -> kNN query) works
        # end-to-end via a fidelity-checked FakeEmbedder that mirrors the real Embedder's
        # interface/dims/clipping. SHUNT_DISALLOW_REAL_EMBEDDER makes a real 600MB ONNX
        # download fail loudly, so this stays hermetic — real models are benchmark/live only.
        env:
          SHUNT_DISALLOW_REAL_EMBEDDER: "1"
        run: >-
          uv run pytest -v
          tests/router/test_fake_embedder_fidelity.py
          tests/router/test_embedding_pipeline_ci.py
      - name: Packaged config loads from installed package
        # Locks the install-anywhere guarantee: the wheel bundles embedding.yaml (the
        # `*.yaml` package-data glob), it resolves via importlib.resources — not a source
        # tree or CWD — parses, and wires into an Embedder. A packaging regression that
        # dropped the file from the wheel fails HERE, loudly, instead of at boot on a user's
        # fresh `pip install`. SHUNT_DISALLOW_REAL_EMBEDDER keeps it hermetic (no ONNX).
        env:
          SHUNT_DISALLOW_REAL_EMBEDDER: "1"
        run: uv run pytest -v tests/config/test_packaged_config_bundling.py
      - name: Test
        # No path argument on purpose: an explicit `tests/` OVERRIDES pyproject's
        # `testpaths`, which is what silently kept benchmark/tests (227 tests) out of
        # CI. Let testpaths be the single source of truth for what gets collected.
        run: uv run pytest -v --tb=short

  # Benchmark integrity: challenge content hashes match the stored version_hash,
  # no removed challenges, model versions current, AND the per-strategy summary
  # derives deterministically from the results.csv source of truth. Light — no
  # live model calls, no embedding downloads (deterministic strategies only).
  benchmark-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev --extra benchmark
      - name: Integrity + derived-artifact drift
        # Run as a module (cwd = repo root) so `from benchmark import config`
        # resolves via sys.path[0]. benchmark is dev/CI-only, not an installed
        # package (see pyproject.toml packages.find), so a by-path invocation
        # would fail with ModuleNotFoundError.
        run: uv run python -m benchmark.runner.check_integrity --check-derived
      - name: Committed figures are not stale
        # `--check-figures` proves the committed PNGs / metrics.json / figures.json were drawn
        # from the CURRENT code+config, without regenerating anything (seconds, no spend). A code
        # change to a strategy, the escalation policy, or the registry leaves the committed figures
        # stale — this is the gate that makes it unquotable rather than silently wrong.
        run: uv run python -m benchmark.pipeline --check-figures

  # Advisory whole-program hygiene — runs separately so its slower/noisier
  # tools never block the fast pre-commit path. Reports, does not fail the build.
  hygiene:
    name: hygiene (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev --extra benchmark
      - name: vulture (dead code)
        continue-on-error: true
        run: uv run vulture
      - name: deptry (dependency hygiene)
        continue-on-error: true
        run: uv run deptry .
      - name: coverage (floor advisory)
        continue-on-error: true
        # Path-less for the same reason as the Test step: `testpaths` decides.
        run: uv run pytest --cov=src/shunt --cov-report=term-missing
