name: Integration handshake

# Opt-in, hermetic dry-run of each tool → Shunt integration. NO real model is
# called, NO secret is needed: a per-tier fake upstream stands in for providers, so
# a green leg proves the wiring (tool reaches Shunt, Shunt routes and returns, the
# X-Shunt-Decision header rides back) — not model quality. The always-on, no-Docker
# proof lives in the normal test job (tests/integrations/test_handshake.py); this
# workflow adds the real-tool legs over Docker.
#
# The matrix is tool × SCENARIO:
#   wiring     — one request reaches Shunt and a decision rides back.
#   escalation — N prompts across real session boundaries against a deterministically
#                red repo; the verdict comes from Shunt's own outcome store (the
#                assert-escalation sidecar), never from grepping a CLI's stdout.
#   live       — a separate, workflow_dispatch-only job below. Never on pull_request.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the LIVE tier (real provider, real spend)"
        type: boolean
        default: false
      live_max_spend_usd:
        description: "Hard spend cap for the live tier, in USD"
        type: string
        default: "1.00"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  pull_request:
    paths:
      - "examples/integrations/**"
      - "tests/integrations/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "src/shunt/config/models.yaml"
      - ".github/workflows/integration-handshake.yml"

jobs:
  # Discover legs from the filesystem: a tool is CI-eligible iff it ships a
  # handshake.yaml, and each such file declares which scenarios it runs. No central
  # list to keep in sync. `live` is filtered out here — it has its own gated job.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os, yaml
          items = []
          for path in sorted(glob.glob("examples/integrations/*/handshake.yaml")):
              spec = yaml.safe_load(open(path))
              tool = os.path.basename(os.path.dirname(path))
              for scenario in spec.get("scenarios") or ["wiring"]:
                  if scenario == "live":
                      continue  # gated job below — never from pull_request
                  block = spec if scenario == "wiring" else (spec.get(scenario) or {})
                  items.append({
                      "tool": tool,
                      "scenario": scenario,
                      "best_effort": bool(block.get("best_effort", False)),
                  })
          print("matrix=" + json.dumps({"include": items}))
          PY

  # Build the Shunt image once and share it as an artifact, so the matrix legs
  # don't each recompile the (heavy) dependency stack.
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Shunt image
        run: docker build -t shunt-router:handshake -f Dockerfile .
      # Boot the PLAIN product image with NO external config, so it must load the
      # registry BAKED INTO THE WHEEL. Catches the packaging gap (models.yaml
      # missing from the wheel) that an editable install and the config-injected
      # handshake legs both hide — the exact crash `release.yml` would otherwise ship.
      - name: Boot smoke — bundled default registry loads
        run: |
          docker run -d --name shunt-boot shunt-router:handshake
          ok=0
          for _ in $(seq 1 20); do
            # Probe from INSIDE the container — proves the app booted and the
            # bundled registry parsed, without assuming host↔container port routing.
            if docker exec shunt-boot python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')" 2>/dev/null; then
              echo "boot OK"; ok=1; break
            fi
            sleep 1
          done
          docker logs shunt-boot
          docker rm -f shunt-boot >/dev/null 2>&1 || true
          test "$ok" = "1"
      - name: Save image
        run: docker save shunt-router:handshake | gzip > /tmp/shunt-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: shunt-image
          path: /tmp/shunt-image.tar.gz
          retention-days: 1

  handshake:
    needs: [discover, build-image]
    runs-on: ubuntu-latest
    # Best-effort legs (real CLI/service onboarding is brittle) never fail the run;
    # the verified legs (best_effort: false) are required and turn the run red. The
    # flag is per SCENARIO: a tool may be best-effort on wiring and required on
    # escalation, or the other way round.
    continue-on-error: ${{ matrix.best_effort }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: ${{ matrix.tool }} / ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shunt-image
          path: /tmp
      - name: Load Shunt image
        run: gunzip -c /tmp/shunt-image.tar.gz | docker load
      - name: Handshake
        run: tests/integrations/run_scenario.sh "${{ matrix.tool }}" "${{ matrix.scenario }}"
      # Which tools announce their working directory to the model? Measured from what
      # the upstream actually received, and published per leg rather than argued about.
      - name: Collect the cwd-announcement measurement
        if: always() && matrix.scenario == 'escalation'
        run: |
          docker compose -f "examples/integrations/${{ matrix.tool }}/compose.escalation.yaml" \
            run --rm --entrypoint sh assert-escalation \
            -c 'cat /record/cwd-report.json 2>/dev/null || echo "{}"' \
            | tee "cwd-${{ matrix.tool }}.json" || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.scenario == 'escalation'
        with:
          name: cwd-report-${{ matrix.tool }}
          path: cwd-${{ matrix.tool }}.json
          retention-days: 7
          if-no-files-found: ignore

  # ── The LIVE tier — authored, gated, and deliberately hard to fire ──────────────
  #
  # Real provider, real money. Four independent gates stand between a push and a
  # charge, and every one of them must open:
  #   1. workflow_dispatch only. `pull_request` and `schedule` cannot reach this job,
  #      so no fork PR and no cron can ever spend.
  #   2. The dispatcher must tick `live: true` by hand.
  #   3. The secret must exist. `secrets.SHUNT_LIVE_API_KEY` is unset by default, and
  #      an unset secret skips the job rather than failing it open.
  #   4. The runner script refuses without SHUNT_LIVE_I_ACCEPT_SPEND=yes.
  # The cap itself is enforced in-run by SHUNT_LIVE_MAX_SPEND_USD, which the live
  # compose passes to the router's budget: the run aborts at the cap rather than
  # discovering the overspend on the bill.
  live:
    needs: build-image
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.live &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live-integration # a protected environment => a human approval step
    strategy:
      fail-fast: true # spend stops at the first failure
      matrix:
        tool: [curl]
    name: ${{ matrix.tool }} / live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shunt-image
          path: /tmp
      - name: Load Shunt image
        run: gunzip -c /tmp/shunt-image.tar.gz | docker load
      - name: Guard — refuse to spend without a key
        env:
          KEY: ${{ secrets.SHUNT_LIVE_API_KEY }}
        run: |
          test -n "$KEY" || { echo "SHUNT_LIVE_API_KEY is unset — not spending"; exit 1; }
      - name: Live scenario
        env:
          SHUNT_LIVE_I_ACCEPT_SPEND: "yes"
          SHUNT_LIVE_API_KEY: ${{ secrets.SHUNT_LIVE_API_KEY }}
          SHUNT_LIVE_BASE_URL: ${{ vars.SHUNT_LIVE_BASE_URL }}
          SHUNT_LIVE_MODEL_ID: ${{ vars.SHUNT_LIVE_MODEL_ID }}
          SHUNT_LIVE_MAX_SPEND_USD: ${{ inputs.live_max_spend_usd }}
        run: tests/integrations/run_scenario.sh "${{ matrix.tool }}" live
