name: Docs

# Build the mkdocs site and publish it straight to GitHub Pages via the Pages
# deployment API — no gh-pages branch. The built site is an ephemeral artifact,
# so no generated HTML ever lands in git. Runs only when the docs or their config
# change on main, so unrelated pushes don't redeploy.
#
# Requires the repo's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  # Build (never deploy) on PRs too. Do not remove this as redundant with the push
  # trigger: while this workflow was push-only it could not run on a PR at all, so the
  # strict build first executed on the MERGE commit — and a broken relative link in
  # docs/free-tier-smoke.md reached `main` past a fully green PR. A gate that cannot run
  # where the defect is introduced provides no coverage.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege: read the source, write only to Pages, mint a short-lived OIDC
# token for the deploy. No contents:write — this workflow never pushes a branch.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight publish (the recommended Pages
# pattern — a cancelled deploy can leave the site half-updated). Scoped per ref so a PR's
# build-only run cannot queue behind an in-flight publish: only `main` reaches the deploy
# job, so the single-deploy guarantee is unaffected.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # docs/assets/*.webp are LFS-tracked (.gitattributes). Without this the
          # checkout leaves 130-byte pointer files, mkdocs copies them verbatim, and
          # the site publishes broken images with a green build.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build (strict — broken links / nav fail the build)
        run: mkdocs build --strict
      # Push-only: a PR proves the site BUILDS, it never produces a publishable
      # artifact. `deploy` is push-only too, so it still receives this.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    needs: build
    # Never from a pull_request — a PR must not be able to publish the public site.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
