# CI handshake spec. This file's PRESENCE makes the tool CI-eligible — the matrix
# in .github/workflows/integration-handshake.yml globs examples/integrations/*/handshake.yaml
# and runs one matrix leg per file. `service` names the compose service whose exit
# code is the verdict; `expected_model` must name a model present in
# tests/integrations/fake_registry.yaml (checked by tests/test_integrations_sync.py).
tool: litellm-proxy
wire: openai
service: client
expected_model: qwen3.7-plus
best_effort: false   # required leg — must pass

# Scenarios this tool runs (workflow matrix = tool x scenario):
#   wiring     — one request reaches Shunt and a decision rides back (compose.yaml)
#   escalation — N prompts across session boundaries make Shunt escalate on verified
#                failures (compose.escalation.yaml + the assert-escalation sidecar)
#   live       — workflow_dispatch only, real provider, hard spend cap (compose.live.yaml)
scenarios: [wiring]
