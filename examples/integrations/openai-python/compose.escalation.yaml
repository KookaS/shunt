# openai-python → Shunt ESCALATION scenario. Same shape as curl's (see
# ../curl/compose.escalation.yaml for the full rationale), driven through the real
# OpenAI SDK so the leg proves the SDK path, not just raw HTTP.
#
# The one detail that carries the whole scenario: a NEW client per prompt, each with its
# own User-Agent. A session is keyed on sha256(source_ip + User-Agent) and the request
# path refreshes an open session's idle deadline before sweeping — so reusing one client
# yields one session and one decision, however many prompts you send. That is exactly
# the false negative this harness replaces.
#
# The verdict is NOT this service's exit code alone: run `assert-escalation` after it.
include:
  - ../compose.base.yaml

services:
  openai-python-escalation:
    image: python:3.12-slim
    depends_on:
      shunt:
        condition: service_healthy
    environment:
      SHUNT_ESC_MARKER: ${SHUNT_ESC_MARKER:-SHUNT-ESC-openai-python}
      SHUNT_SESSION_INACTIVITY_TIMEOUT: ${SHUNT_SESSION_INACTIVITY_TIMEOUT:-1}
      SHUNT_ESC_PROMPTS: ${SHUNT_ESC_PROMPTS:-4}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        pip install --quiet --disable-pip-version-check "openai>=1.55"
        python - <<'PY'
        import json, os, time, urllib.request
        from openai import OpenAI

        BASE = "http://shunt:8080"
        MARK = os.environ["SHUNT_ESC_MARKER"]
        IDLE = int(os.environ["SHUNT_SESSION_INACTIVITY_TIMEOUT"])
        N = int(os.environ["SHUNT_ESC_PROMPTS"])


        def verified() -> int:
            with urllib.request.urlopen(f"{BASE}/admin/loop-health") as resp:
                return int(json.load(resp)["label_coverage"]["verified_labeled"])


        def wait_verified(target: int, timeout: float = 300.0) -> None:
            """Bounded poll on observed state — the pattern tests/e2e/helpers.py uses."""
            deadline = time.monotonic() + timeout
            while time.monotonic() < deadline:
                seen = verified()
                if seen >= target:
                    print(f"verified_labeled={seen} (>= {target})", flush=True)
                    return
                time.sleep(1)
            raise SystemExit(f"timed out waiting for verified_labeled >= {target}")


        def send(i: int) -> None:
            # A fresh client per prompt: distinct User-Agent => distinct tool identity
            # => a genuinely new session, never a REUSED one with a locked model.
            client = OpenAI(
                base_url=f"{BASE}/v1",
                api_key="ignored",
                default_headers={"User-Agent": f"shunt-escalation-openai-python/{i}"},
            )
            raw = client.chat.completions.with_raw_response.create(
                model="auto",
                messages=[{"role": "user", "content": f"{MARK} prompt {i} — the test suite is failing, fix it"}],
            )
            print(f"prompt {i} -> {raw.headers.get('x-shunt-decision')}", flush=True)


        for i in range(1, N + 1):
            sent = time.monotonic()
            send(i)
            # The inactivity deadline is a duration; it cannot be polled shorter than itself.
            time.sleep(max(0.0, IDLE + 1 - (time.monotonic() - sent)))
            if i >= 2:
                # Prompt i closed session i-1, so i-1 verified outcomes must land before
                # the next decision is made.
                wait_verified(i - 1)

        print(f"OK: openai-python drove {N} prompts across {N} sessions — "
              "run assert-escalation for the verdict")
        PY
