      output_cost_per_1m: 12.0
      cache_read_cost_per_1m: 0.2
      price_provider: requesty
      price_source: https://artificialanalysis.ai/models
      price_as_of: "2026-07-19"
      price_note: >-
        RESEARCH-ESTIMATED (Artificial Analysis, 2026-07-19), NOT a live Requesty
        listing. Google length-tiered pricing: ≤200K-context tier ($2/$4 in,
        $12/$18 out above 200K). Benchmark-DISABLED (omitted from benchmark/benchmark.yaml).
    # reasoning_effort is the portable OpenAI-compatible knob requesty's `openai/`
    # driver passes through; Gemini's native `thinking_level` risks a 400 there.
    # UNVERIFIED against a live response — smoke-test before relying on it.
    # `default_arm: low` for the effort-ladder's cache-safe rung — see qwen3.7-plus.
    reasoning:
      default_arm: low
      arms:
        - id: low
          rank: 0
          api: {reasoning_effort: low}
        - id: high
          rank: 1
          api: {reasoning_effort: high}
  # ALSO USED as a judge (since 2026-08-25) by benchmark/routing/scripts/judge_probe.py.
