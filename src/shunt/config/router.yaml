# Shipped router policy — the production routing defaults.
# Override by writing your own at $SHUNT_CONFIG_DIR/router.yaml (or
# ~/.config/shunt/router.yaml). Your file replaces this one; it is not merged.
# Env vars (SHUNT_ROUTER_STRATEGY, SHUNT_EXPLORATION_ENABLED,
# SHUNT_EXPLORE_BUDGET_FRAC) and CLI flags win over both.
router:
  # Active algorithm — one of: knn | always_cheap | always_frontier.
  strategy: knn

  # Knobs for the active strategy.
  policy:
    k: 20
    success_rate_threshold: 0.6   # lower = more cost savings, higher = more reliability
    min_samples: 3

  # Cost-aware Thompson-sampling exploration. Shipped ON so the router can gather
  # evidence, but be clear about what that costs today: outcome capture is manual
  # (`shunt flag`), and the one offline replay measured exploration at -2.8pp pass
  # rate and +$0.013/task with its learning benefit set to zero. Set
  # `enabled: false` to route on current beliefs only.
  exploration:
    enabled: true
    prior_alpha: 1.0              # Beta(alpha, beta) base prior over per-model success
    prior_beta: 1.0
    explore_budget_frac: 0.4      # cumulative cap -> total spend <= ~1.4x exploit-only
    conservative_alpha: 0.1       # safety slack vs the fixed-cheap baseline
    propensity_mc_samples: 100    # logged TS propensity, for off-policy evaluation
    prior_strength_cap: 20.0      # max pseudo-counts an offline per-model estimate can seed

  # Auto-escalation on repeated verified failure. Shipped OFF: it needs the verified
  # outcome-capture loop (below) writing Tier-2 failures, and enabling it adds exploration
  # cost. When enabled, a SAME verified failure (same normalized failing-check id) seen
  # escalate_after_n times within stale_window decisions raises one rung at the NEXT session
  # boundary — effort first (cache-safe), then a model rank. Never mid-cached-turn.
  # A switch inside a cached turn invalidates the prompt cache and the recompute costs ~4x
  # the context, so the boundary is the ONLY point a model change is free.
  escalation:
    enabled: false
    # 2, not 1: a single red is normal fail-then-fix, so 1 is failure-biased. 2 is a
    # PRIOR: in the as-shipped policy sweep (the counter this product runs) every low
    # threshold is at chance — n=2 fires 727/727 at AUROC 0.500, n=3 726/727 at 0.501 —
    # so no shipped-counter measurement prefers one over the other. See the comment on
    # EscalationConfig.escalate_after_n in src/shunt/router/escalation.py.
    escalate_after_n: 2           # same-key verified failures before a step
    stale_window: 10              # a failure not recurring within N decisions is retired
    blocking_exit_code: 2         # FUTURE hook-stream path only; the off-wire test gate counts a
                                  # real failure by verifier outcome (a pytest/jest/go red is exit
                                  # 1, cargo 101), not this code — a collection/import error (exit 2)
                                  # is treated as infra, not a capability failure.
    # Under effort_then_rank the router first raises the current model's reasoning EFFORT arm
    # (same model → cache namespace unchanged, cache-safe); the arm's params are applied to the
    # outbound request. It steps to the next-higher-RANK model only once the model's reasoning
    # ladder is exhausted (or the model declares no reasoning arms). rank_only skips the effort rung.
    ladder: effort_then_rank      # effort_then_rank | rank_only (one rank per step, never straight to the top)
    # Epsilon-greedy randomization at FLAGGED checkpoints, with the realized propensity logged.
    # A SEPARATE opt-in on top of `enabled`: turning escalation on must never silently randomize
    # your routing. 0.0 (default) = today's fully deterministic behaviour, bit for bit.
    # Why it exists: under a deterministic policy P(escalate) = 0, the overlap condition every
    # off-policy estimator needs FAILS, so "does escalation help?" is not identified at any
    # sample size. Randomizing a small fraction of flagged checkpoints and logging the
    # propensity is what makes the question answerable (benchmark/escalation/ope.py). The
    # explored arm is always HOLD — exploration can only WITHHOLD an escalation, never invent
    # one, so it introduces no model switch the policy would not already make (cache-safe).
    exploration_epsilon: 0.0      # 0 = deterministic; 0.1-0.3 while collecting identifiable data
    exploration_seed: null        # null ⇒ the router draws one and records it on every decision

  # Off-wire automatic outcome capture. With a work_dir set, at each session's close shunt
  # re-runs THAT repo's test suite (pytest/jest/go/cargo, auto-detected) off the wire and
  # records the verified pass/fail as a Tier-2 outcome — no human `shunt flag` needed. Unset
  # ⇒ capture is MANUAL. Runs only where shunt sits alongside the code+tests (`shunt start`
  # with SHUNT_WORK_DIR); see docs/feedback.md.
  capture:
    work_dir: null
    # work_dirs: { "<tool_identity_hash>": "/path/to/repo" }   # per-tool override map
    # Opt-in full-content per-step trajectory capture. Shipped OFF (secure-by-default): only
    # behaviour-only verified-outcome fields are recorded until set true. When on, every
    # free-text field is redacted then encrypted to a LOCAL, gitignored dir (never on the
    # wire, never mid-cached-turn); needs the 'capture' extra + SHUNT_ESCALATION_KEY.
    full_content: false
    # Where the encrypted local plane is written. null ⇒ outside the repo
    # ($SHUNT_HOME/trajectories); never inside the tree, never committed.
    trajectory_dir: null

  # Batch offline re-fit: rebuild the kNN index from the append-only outcome log every
  # N captured outcomes (0 disables; the boot-time rebuild still runs). Learning is
  # batch-first — the index is a rebuildable projection, not updated online per outcome.
  refit:
    every_n_outcomes: 50

  # Which registry models (src/shunt/config/models.yaml) the live router may pick.
  # Empty/absent = every registry model. This is core + the latest frontier models,
  # EXCLUDING the superseded claude-opus-4-6 (it stays in the registry as the old
  # kill-gate baseline, just not live by default). A model absent from this list is
  # known to the registry but NOT chosen for live inference. The frontier entries
  # need their provider key (ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY)
  # or the router marks them unhealthy and falls back. Benchmark model selection is
  # separate (benchmark/benchmark.yaml `models:`).
  models:
    - qwen3.7-plus
    - deepseek-v4-flash
    - gpt-5-mini
    - kimi-k2.5
    - zai-glm-5.2
    - kimi-k3
    - gemini-3.1-pro
    - gpt-5.6-sol
    - claude-fable-5
    - claude-opus-4-8
