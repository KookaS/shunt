# Single source of truth for local + CI checks. Enforcement hooks are `local`
# + `language: system` so they run the exact ruff/mypy pinned in the project
# venv (pip install -e '.[dev]') — guaranteeing pre-commit ↔ local ↔ CI parity.
# Run from the project venv:  pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        # `"$@"` forwards the filenames pre-commit appends; the `--` makes them
        # positional. venv-prefixed PATH so the pinned ruff runs outside an active venv.
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" ruff check --fix --force-exclude "$@"' --
        language: system
        types_or: [python, pyi]
        require_serial: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" ruff format --force-exclude "$@"' --
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        # Prepend the repo venv to PATH so mypy + the interpreter it imports from
        # (pydantic/fastapi types) resolve even when `git commit` runs outside an
        # activated venv. Falls back to PATH if .venv is absent.
        #
        # tools/ is in scope: it holds the SH0xx gates and the provider probe's
        # signature matching (status sets, optional body patterns, None-able
        # rows) — branchy comparison logic where a type error IS the bug, and
        # which no test can be trusted to cover exhaustively.
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" mypy src/ benchmark/ tools/'
        language: system
        types: [python]
        pass_filenames: false
      # --- Custom AST checks (SH0xx): BLOCKING. A genuine exception is an
      # explicit, greppable `# noqa: SH00x (reason)` on the line — never a
      # blanket advisory flag. ---
      - id: sh001-no-mutable-globals
        name: SH001 no module-level mutable globals
        entry: python tools/lint/check_mutable_globals.py
        language: system
        types: [python]
      - id: sh002-docstring-length
        name: SH002 docstrings <= 3 lines
        entry: python tools/lint/check_docstring_length.py
        language: system
        types: [python]
      - id: sh003-no-syspath-mutation
        name: SH003 no sys.path mutation (advisory)
        entry: python tools/lint/check_syspath.py --advisory
        language: system
        types: [python]
        verbose: true
      # SH004 scans the whole shipped surface (benchmark/src/docs/README) on every
      # run — pass_filenames:false + always_run so a leak can't slip in via an
      # unstaged file. BLOCKING.
      - id: sh004-no-internal-refs
        name: SH004 no internal planning-vocab leaks in shipped text
        entry: python tools/lint/check_internal_refs.py
        language: system
        pass_filenames: false
        always_run: true
      # SH005 scans all of src/shunt/ on every run — same rationale as SH004:
      # pass_filenames:false + always_run so a pricing read can't slip in via an
      # unstaged file. BLOCKING.
      - id: sh005-pricing-isolation
        name: SH005 router must not read benchmark pricing
        entry: python tools/lint/check_pricing_isolation.py
        language: system
        pass_filenames: false
        always_run: true
      # SH006 enforces the dependency directions the architecture depends on (rule table):
      # src/shunt -> benchmark forbidden; routing/calibration -> benchmark.escalation forbidden
      # (escalation is a leaf consumer). Same always_run rationale as SH004/SH005. BLOCKING.
      - id: sh006-import-direction
        name: SH006 import-direction rule table
        entry: python tools/lint/check_import_direction.py
        language: system
        pass_filenames: false
        always_run: true
      # SH007 keeps benchmark/plot_frame.py the ONE place a figure is created, titled and
      # saved. It reserves the title band (a caller-owned title cannot be measured before
      # the axes rect exists, so it lands on the content), pins the named canvas sizes, runs
      # the layout audit, and records the figure into figures.json. Tests may still build a
      # raw figure — the layout-audit tests have to construct the defect they assert against
      # — but may not save or title one. BLOCKING.
      - id: sh007-plot-frame
        name: SH007 figures created, titled and saved through the plot frame
        entry: python tools/lint/check_plot_frame.py
        language: system
        types: [python]
      # SH009 makes the figure set a BIJECTION: every committed PNG has a figures.json row
      # AND a docs section, and every row/section has a live PNG — so a retired figure cannot
      # leave a stale docs block describing a plot nobody can look at. It also holds the three
      # on-canvas strings byte-identical between the manifest and the prose. Whole-tree scan
      # (the SH004-SH006 shape, not SH007's file filter): the failure it catches is a
      # DELETION, which no staged-file list ever contains. BLOCKING.
      - id: sh009-figure-docs
        name: SH009 every figure has a manifest row and a docs section
        entry: python tools/lint/check_figure_docs.py
        language: system
        pass_filenames: false
        always_run: true
      # SH008 makes the "real-only embeddings" rule structural instead of prose:
      # fastembed may be constructed ONLY in src/shunt/router/embedder.py (so the
      # model name, cache dir, char clip, fingerprint and test wall cannot be
      # bypassed), and proxy vectorizers (TF-IDF/hashing/count) are banned outside
      # tests. Same always_run rationale as SH004-SH006. BLOCKING.
      - id: sh008-embedder-isolation
        name: SH008 real embeddings only (no raw fastembed, no proxy vectorizers)
        entry: python tools/lint/check_embedder_isolation.py
        language: system
        pass_filenames: false
        always_run: true
      # SH010 parses every ```mermaid fence with mermaid's OWN grammar — the same parser
      # the docs site and GitHub run client-side. A syntax error there is invisible to
      # every other gate in this file: ruff/mypy/pytest pass, `mkdocs build --strict`
      # builds clean, and the only symptom is a red "Syntax error in text" box in a
      # reader's browser. This is the one gate that sees it. Unlike SH004-SH006/SH009 the
      # failure it catches is an EDIT, not a deletion, so the staged-file list suffices —
      # which keeps a commit that touches no diagram at ~0.13s (the script defers the
      # jsdom+mermaid import until it actually finds a fence). Deps come from pre-commit's
      # own node env: no package.json, no node_modules, nothing added to the shipped tree.
      # Keep the pin in the same major as the mermaid the docs site loads. BLOCKING.
      # SH012 makes the "no committed entrypoint reproduces this number" failure class
      # structural. Every number-bearing site in the three result docs (strategy-variant
      # rows, paired comparisons, task-count / scorable / usable claims, pp-delta-with-CI
      # claims, task-set restatements) must carry a provenance marker: a generator marker
      # naming the committed entrypoint that emits it, or a frozen-value marker naming
      # n/date/run of the corpus it was computed on. A frozen marker without a corpus, or
      # a signature match with no marker at all (a seventh site added silently), fails.
      # Whole-tree scan (the SH004/SH009/SH011 shape): the failure is an addition/edit,
      # and only a scan of the committed docs sees every number-bearing line. BLOCKING.
      - id: sh012-number-provenance
        name: SH012 number-bearing sites carry a provenance marker
        entry: python tools/lint/check_number_provenance.py
        language: system
        pass_filenames: false
        always_run: true
      # SH011 makes strategy deployability structural. The benchmark used to carry its own
      # idea of "deployable" — three literal sets in three files, none derived from
      # LIVE_STRATEGIES — so a strategy the router rejects at boot was drawn as a
      # Pareto-optimal deployable point, the public headline was built on it, and the kill
      # gate was adjudicated on it. This asserts every registered strategy is classified,
      # the `live` set equals the product's allowlist, and every BLOCKED entry names a
      # path to live. Whole-tree scan (the SH004-SH006/SH009 shape): a strategy DELETED
      # from one list and not the other is the drift, and no staged-file list sees it.
      # BLOCKING.
      - id: sh011-strategy-class
        name: SH011 every strategy is classified (live/bound/control/blocked)
        entry: python tools/lint/check_strategy_class.py
        language: system
        pass_filenames: false
        always_run: true
      - id: sh010-mermaid-parse
        name: SH010 mermaid diagrams parse
        entry: node tools/lint/check_mermaid.mjs
        language: node
        additional_dependencies: ["mermaid@11.16.1", "jsdom@30.0.1"]
        files: \.(md|markdown)$
      - id: validate-benchmark-config
        name: validate benchmark benchmark.yaml
        # Run as a module from the repo root (pre-commit's cwd) so `from benchmark
        # import config` resolves the harness via sys.path[0], not an installed
        # package — benchmark is deliberately NOT installed/shipped (see
        # pyproject.toml packages.find). `-m` puts cwd on the path; no PYTHONPATH
        # or sys.path mutation (SH003). Use the repo venv's python even when
        # committing outside an activated venv.
        entry: bash -c 'PATH="$PWD/.venv/bin:$PATH" python -m benchmark.validate_config'
        language: system
        pass_filenames: false
        files: ^benchmark/benchmark\.yaml$
      - id: uv-lock-check
        name: uv.lock matches pyproject.toml
        # No gate covered this, and it showed: scikit-learn was moved out of the core
        # dependencies but the lock still pinned it there, so `uv sync` kept installing
        # the old set. A dependency fix that never reaches the lock is not shipped.
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.log$'   # regenerable run artifacts (kill_gate.log)
      - id: end-of-file-fixer
        exclude: '\.log$'
      - id: check-yaml
        # mkdocs config carries a `!!python/name:` tag (mermaid superfence) that
        # check-yaml's safe loader can't construct; the file is validated by
        # `mkdocs build --strict` in the Docs workflow instead.
        exclude: ^mkdocs\.ya?ml$
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
