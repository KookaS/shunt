# Non-shipped free-model OVERLAY registry — collection-only, never loaded by a normal
# Shunt boot and never part of `src/shunt/config/models.yaml`.
#
# WHY THIS FILE EXISTS. The benchmark can harvest datapoints from free/discounted provider
# tiers without any free row ever shipping. This registry holds the provider rows and their
# free model ids as COLLECTION-ONLY entries; `run_matrix --extra-models` (or the
# `--free-registry <path>` / `SHUNT_FREE_REGISTRY` override in benchmark/config.py) merges a
# requested id into the run's pricing view at the run site only. The shipped registry, the
# live router pool, `benchmark.yaml`'s enabled set, `capability_rank`, the pareto axes and
# the kill gate never see these rows.
#
# HARD RULES (the collection-only free-model policy, reversing the earlier free-model
# retirement):
#   1. NEVER enable a row here in benchmark.yaml. `config.enabled_models()` refuses any
#      overlay id, so a free model cannot enter the enabled set / kill-gate / analysis.
#   2. Every row records the model's REAL list price — never $0. A $0 list price would make
#      the row the pareto global minimum and rank 0 in any cost comparison. The price is the
#      paid channel's published list price for the same weights (see each `price_source`);
#      the collection itself is free-promo, so a harvested row's `real_cost` may be 0.
#   3. NO `cache_read_cost_per_1m` on any row: gateway cache namespaces can be shared across
#      tenants, so a harvested cache rate would look measured without being so.
#   4. Public-benchmark-prompts-only until each provider's ToS is read (see the probe report).
#
# PROVENANCE. Rows were assembled 2026-09-10 from a desk survey of provider catalogues.
# List prices come from `https://models.dev/api.json` (the model's canonical paid listing) or
# the paid twin in the live OpenRouter catalog. Models whose weights
# have no published paid list price anywhere are intentionally OMITTED rather than priced $0.
# Free listings rotate on a days-to-weeks timescale — re-verify before a measured run.
#
# `version` / `model` / `model_id` are the ONE bare canonical identity (the convention's
# `scan_free_models.canonical_slug`): lowercase, no provider prefix, no `/`/`:`/`@`, no
# `-free`/`:free`/`-explabs` marker. `lane` is the provider's RAW channel listing id — the
# actual wire id the runner calls — and is the only field that may carry the serving path.
#
# CORPUS IDENTITY (decision recorded, not implicit). The benchmark keeps the two roles apart:
#   * `lane` is the CHANNEL identity. In the results CSVs it is the `lane` column, and it is
#     the resume/dedupe key `(challenge_id, lane, reasoning, rep)`; re-keying it would orphan
#     collected cells. Here it is the raw listing id; the row name is its stable slug.
#   * `version` / `model` / `model_id` (and the csv `model`/`model_version`) is the CANONICAL
#     weights identity. Grouping the free and paid corpora across providers is done on it.
# Canonicalisation edits only the identity fields (via the Tier-2 aliases in
# `benchmark/routing/data/model_identity.yaml`, the durable path a rescan re-derives).
#
# ARCHIVING. A specific `(lane, provider)` row may be retired with `archived: true` plus
# `archived_at` / `archive_reason`. The row is retained here, in the corpus and in provenance,
# but `refresh_free_campaign` withholds it from the runnable set (reason `archived`). Archive
# one channel only: the same weights on a provider that still serves them stay schedulable.

