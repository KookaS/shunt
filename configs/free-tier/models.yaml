# Free-tier CI registry — used ONLY by the weekly free-tier smoke
# (benchmark/runner/free_tier_smoke.py, driven from configs/free-tier/ via
# SHUNT_CONFIG_DIR). It is a deliberately SEPARATE registry from the shipped one:
# OpenRouter's `:free` models price at $0, and shipping a $0 model in
# src/shunt/config/models.yaml would rank it cheapest-first and silently change
# production routing. This directory is never loaded by a normal shunt boot —
# only the smoke points SHUNT_CONFIG_DIR here.
#
# Model verified against the live public catalog at
# https://openrouter.ai/api/v1/models (2026-08-11): pricing prompt/completion = 0.
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env_var: OPENROUTER_API_KEY
    litellm_prefix: openrouter

models:
  gpt-oss-20b-free:
    model_id: openai/gpt-oss-20b:free
    provider: openrouter
    version: gpt-oss-20b-free
    supports_streaming: true
    supports_cache_control: false
    pricing:
      input_cost_per_1m: 0
      output_cost_per_1m: 0
      cache_read_cost_per_1m: 0
      price_provider: openrouter
      price_source: https://openrouter.ai/models/openai/gpt-oss-20b
      price_as_of: "2026-08-11"
      price_note: OpenRouter :free listing — genuinely $0 (verified against the live public catalog 2026-08-11).
