# Free-tier CI registry — used ONLY by the weekly free-tier smoke
# (benchmark/runner/free_tier_smoke.py, driven from configs/free-tier/ via
# SHUNT_CONFIG_DIR). It is a deliberately SEPARATE registry from the shipped one:
# OpenRouter's `:free` models price at $0, and shipping a $0 model in
# src/shunt/config/models.yaml would rank it cheapest-first and silently change
# production routing. This directory is never loaded by a normal shunt boot —
# only the smoke points SHUNT_CONFIG_DIR here.
#
# Model verified against the live public catalog at
# https://openrouter.ai/api/v1/models (2026-08-23): present, pricing prompt/completion = 0.
# Slugs rot: `openai/gpt-oss-20b:free` was RETIRED by OpenRouter and now 404s, pointing at
# the PAID `openai/gpt-oss-20b` — which is not a substitute in a $0 smoke. Re-verify against
# that endpoint before editing this file.
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env_var: OPENROUTER_API_KEY
    litellm_prefix: openrouter

models:
  nemotron-nano-9b-free:
    model_id: nvidia/nemotron-nano-9b-v2:free
    provider: openrouter
    version: nemotron-nano-9b-v2-free
    supports_streaming: true
    supports_cache_control: false
    pricing:
      input_cost_per_1m: 0
      output_cost_per_1m: 0
      cache_read_cost_per_1m: 0
      price_provider: openrouter
      price_source: https://openrouter.ai/models/nvidia/nemotron-nano-9b-v2
      price_as_of: "2026-08-23"
      price_note: OpenRouter :free listing — genuinely $0 (verified against the live public catalog 2026-08-23).
